<header class="site-header">
  <div class="container inner">
    <a class="brand" routerLink="/">
      <span class="mark">O/L</span>
      <span class="brand-text">
        <span class="name">Learning Hub</span>
        <span class="sub">Maths &middot; Science &middot; IT</span>
      </span>
    </a>
    <nav>
      <a routerLink="/subject/Mathematics" routerLinkActive="active">Maths</a>
      <a routerLink="/subject/Science" routerLinkActive="active">Science</a>
      <a routerLink="/subject/IT" routerLinkActive="active">IT</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active" class="admin-link on">&#128275; Admin</a>
        <button class="btn small ghost" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/admin" class="admin-link">&#128274; Admin</a>
      }
    </nav>
  </div>
</header>
